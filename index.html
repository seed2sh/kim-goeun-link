<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김고은 - 나무위키로 이동</title>
<style>
  :root {
    --bg: #f7f7f5;
    --fg: #1d2a2a;
    --muted: #5d6b6b;
    --accent: #00a69c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161c1c;
      --fg: #e8eeee;
      --muted: #9fb0b0;
      --accent: #2ccfc3;
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
  }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 2rem; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.go {
    display: inline-block;
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }
  a.go:focus-visible, button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  button {
    display: block;
    margin: 16px auto 0;
    background: none;
    border: 0;
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    text-decoration: underline;
  }
</style>
</head>
<body>
<main>
  <h1>김고은</h1>
  <p id="status">3초 후 나무위키로 이동합니다.</p>
  <a class="go" id="link" href="https://namu.wiki/w/%EA%B9%80%EA%B3%A0%EC%9D%80">지금 이동</a>
  <button id="cancel" type="button">자동 이동 취소</button>
</main>

<script>
  var URL_TARGET = "https://namu.wiki/w/" + encodeURIComponent("김고은");
  var seconds = 3;
  var status = document.getElementById("status");
  var timer = setInterval(function () {
    seconds -= 1;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = URL_TARGET;
    } else {
      status.textContent = seconds + "초 후 나무위키로 이동합니다.";
    }
  }, 1000);

  document.getElementById("cancel").addEventListener("click", function () {
    clearInterval(timer);
    status.textContent = "자동 이동을 취소했습니다. 아래 버튼으로 이동할 수 있습니다.";
    this.hidden = true;
  });
</script>
</body>
</html>
